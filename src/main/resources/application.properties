spring.application.name=school-erp-backend
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://ep-snowy-king-aopqgrht-pooler.c-2.ap-southeast-1.aws.neon.tech/neondb?sslmode=require&channelBinding=require&socketTimeout=30&tcpKeepAlive=true&prepareThreshold=5&preparedStatementCacheQueries=256&preparedStatementCacheSizeMiB=5&currentSchema=public}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:neondb_owner}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${SPRING_JPA_FORMAT_SQL:false}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.query.plan_cache_max_size=${HIBERNATE_QUERY_PLAN_CACHE_MAX_SIZE:128}
spring.jpa.properties.hibernate.query.plan_parameter_metadata_max_size=${HIBERNATE_QUERY_PARAM_META_MAX_SIZE:64}
spring.data.jpa.repositories.bootstrap-mode=${SPRING_DATA_JPA_BOOTSTRAP_MODE:lazy}

spring.flyway.enabled=true
logging.level.org.flywaydb=${LOGGING_LEVEL_FLYWAY:INFO}
logging.level.org.hibernate.SQL=${LOGGING_LEVEL_SQL:WARN}
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=false
spring.flyway.repair=true
spring.flyway.default-schema=public
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:10}
spring.datasource.hikari.connection-init-sql=SET search_path TO public
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:2}
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.connection-timeout=20000
server.port=${PORT:8080}
server.address=0.0.0.0
server.tomcat.threads.max=${TOMCAT_MAX_THREADS:50}
server.tomcat.threads.min-spare=${TOMCAT_MIN_SPARE_THREADS:5}
app.jwt.secret=${APP_JWT_SECRET:change-me-change-me-change-me-change-me-change-me}
app.jwt.access-token-expiration-ms=${APP_JWT_ACCESS_TOKEN_EXPIRATION_MS:86400000}
app.jwt.refresh-token-expiration-ms=${APP_JWT_REFRESH_TOKEN_EXPIRATION_MS:604800000}

# ===================================================================
# Amazon S3 Centralized Cloud Storage Configuration
# ===================================================================
app.storage.provider=${APP_STORAGE_PROVIDER:local}
app.aws.region=${AWS_REGION:ap-south-1}
app.aws.s3.bucket=${AWS_S3_BUCKET:schooly-production-files}
app.aws.access-key-id=${AWS_ACCESS_KEY_ID:}
app.aws.secret-access-key=${AWS_SECRET_ACCESS_KEY:}
cloud.aws.credentials.access-key=${AWS_ACCESS_KEY_ID:}
cloud.aws.credentials.secret-key=${AWS_SECRET_ACCESS_KEY:}

# ===================================================================
# Razorpay Payment Gateway & Route Configuration
# ===================================================================
app.payment.gateway.enabled=${RAZORPAY_ENABLED:true}
app.payment.gateway.sandbox-mode=${RAZORPAY_SANDBOX_MODE:true}
app.payment.razorpay.key-id=${RAZORPAY_KEY_ID:rzp_test_placeholder_key}
app.payment.razorpay.key-secret=${RAZORPAY_KEY_SECRET:placeholder_secret}
app.payment.razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:placeholder_webhook_secret}
app.payment.razorpay.merchant-name=${RAZORPAY_MERCHANT_NAME:Schooly Platform}
