services:
  postgres:
    image: postgres:16-alpine
    container_name: schooly-postgres
    restart: always
    environment:
      POSTGRES_DB: schooly_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d schooly_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: schooly-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://ep-snowy-king-aopqgrht-pooler.c-2.ap-southeast-1.aws.neon.tech/neondb?sslmode=require&channelBinding=require&socketTimeout=30&tcpKeepAlive=true&prepareThreshold=5&preparedStatementCacheQueries=256&preparedStatementCacheSizeMiB=5
      SPRING_DATASOURCE_USERNAME: neondb_owner
      SPRING_DATASOURCE_PASSWORD: npg_rowJC37Isvuj
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_FLYWAY_ENABLED: "true"
      SPRING_FLYWAY_VALIDATE_ON_MIGRATE: "false"
      SPRING_FLYWAY_BASELINE_ON_MIGRATE: "true"
      CORS_ALLOWED_ORIGINS: "http://localhost:3000,http://localhost:5173"

volumes:
  pgdata:
