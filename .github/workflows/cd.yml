name: Backend CD (Render)

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'

concurrency:
  group: backend-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Render Deploy Hook
        env:
          RENDER_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_HOOK" ]; then
            echo "::error ::RENDER_DEPLOY_HOOK_URL secret is not configured in repository settings."
            exit 1
          fi
          echo "Triggering Render deployment..."
          response=$(curl -s -w "\n%{http_code}" -X POST "$RENDER_HOOK")
          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')
          
          if [ "$http_code" -ge 200 ] && [ "$http_code" -lt 300 ]; then
            echo "Deploy hook triggered successfully (HTTP $http_code)."
            echo "$body"
          else
            echo "::error ::Deploy hook failed with status $http_code: $body"
            exit 1
          fi

      - name: Health Check / Smoke Test
        env:
          HEALTH_URL: ${{ secrets.BACKEND_HEALTH_CHECK_URL || 'https://schooly-backend-2pky.onrender.com/health' }}
        run: |
          echo "Waiting 30 seconds for Render to initialize deployment..."
          sleep 30
          
          MAX_ATTEMPTS=15
          ATTEMPT=1
          SUCCESS=0
          
          until [ $ATTEMPT -gt $MAX_ATTEMPTS ]; do
            echo "Attempt $ATTEMPT of $MAX_ATTEMPTS: probing $HEALTH_URL..."
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -m 10 "$HEALTH_URL" || echo "failed")
            
            if [ "$HTTP_STATUS" = "200" ]; then
              echo "Smoke test passed! Service is healthy (HTTP 200)."
              SUCCESS=1
              break
            fi
            
            echo "Service responded with status '$HTTP_STATUS'. Retrying in 15 seconds..."
            sleep 15
            ATTEMPT=$((ATTEMPT + 1))
          done
          
          if [ $SUCCESS -ne 1 ]; then
            echo "::warning ::Health check did not respond with HTTP 200 within timeout. Check Render dashboard logs."
          fi
